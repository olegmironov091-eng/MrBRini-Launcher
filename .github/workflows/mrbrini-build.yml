
name: Build MrBRini APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q MrBRini_Launcher_1.4.0_Source.zip -d source
          cd source/MrBRini_1.1
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MrBRini-APK
          path: source/MrBRini_1.1/android/app/build/outputs/apk/debug/app-debug.apk
